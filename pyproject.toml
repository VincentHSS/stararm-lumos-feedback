[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_lumos_stararm102"
version = "0.6.30"
description = "Lumos robot and StarArm102 teleoperator adapters for LeRobot"
requires-python = ">=3.12"
dependencies = ["lerobot[core_scripts]>=0.6.2,<0.7", "pyserial>=3.5,<4", "fashionstar-uart-sdk", "python-can>=4.4,<5", "PyYAML>=6,<7"]

[project.scripts]
lumos-lerobot = "lerobot_robot_lumos_stararm102.cli:main"
lumos-feedback-model = "stararm_lumos_feedback.model:main"
lumos-feedback = "stararm_lumos_feedback.cli:main"

[tool.setuptools.package-data]
stararm_lumos_feedback = [
    "native/*.cpp",
    "web/*.html",
    "web/*.js",
    "web/*.css",
    "web/vendor/*.js",
    "web/vendor/*.txt",
    "web/icons/*.svg",
    "web/icons/*.txt",
    "web/models/lumos-touch-v3/*.urdf",
    "web/models/lumos-touch-v3/*.json",
    "web/models/lumos-touch-v3/*.txt",
    "web/models/lumos-touch-v3/meshes/*.STL",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
extend-exclude = ["_legacy.py", "test_follow_control.py", "stararm102_lumos_teleop.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
